{% extends "admin/base_site.html" %}

{% block content %}
<h1>{{ title }}</h1>

<form method="post">
    {% csrf_token %}
    {% for b in bookings %}
        <input type="hidden" name="{{ action_checkbox_name }}" value="{{ b.pk }}">
    {% endfor %}
    <input type="hidden" name="action" value="reject_with_reason">
    <input type="hidden" name="apply" value="1">

    <ul>
        {% for b in bookings %}
            <li>{{ b.user.username }} → {{ b.session.title }} ({{ b.session.date|date:"d.m.Y H:i" }})</li>
        {% endfor %}
    </ul>

    <p>
        <label for="reason">Причина отклонения:</label><br>
        <textarea name="reason" id="reason" rows="4" cols="60" required></textarea>
    </p>

    <button type="submit" class="button default">Отклонить записи</button>
    <a href="{% url 'admin:main_booking_changelist' %}">Отмена</a>
</form>
{% endblock %}
