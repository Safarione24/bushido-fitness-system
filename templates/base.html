<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Bushido{% endblock %}</title>
</head>
<body>

<header>
    <a href="{% url 'home' %}">Bushido</a>
    {% if user.is_authenticated %}
        | <a href="{% url 'booking_list' %}">Мои записи</a>
        | <a href="{% url 'logout' %}">Выйти</a>
    {% else %}
        | <a href="{% url 'login' %}">Войти</a>
        | <a href="{% url 'register' %}">Регистрация</a>
    {% endif %}
</header>

<hr>

<main>
    {% block content %}{% endblock %}
</main>

</body>
</html>
