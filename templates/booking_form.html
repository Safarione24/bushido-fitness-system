{% extends 'base.html' %}

{% block content %}
    <h1>Новая запись</h1>
    <form method="post" id="booking-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Записаться</button>
    </form>
    <div id="result"></div>
{% endblock %}

{% block scripts %}
<script>
$(document).ready(function() {
    $('#booking-form').on('submit', function(e) {
        e.preventDefault();
        $.ajax({
            url: window.location.href,
            type: 'POST',
            data: $(this).serialize(),
            success: function(response) {
                if (response.ok) {
                    $('#result').html('Запись создана!');
                } else {
                    $('#result').html(response.error);
                }
            }
        });
    });
});
</script>
{% endblock %}
